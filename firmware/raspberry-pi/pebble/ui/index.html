<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>pebble(a)</title>
<style>
/* iOS 27 look: light wallpaper, Liquid-Glass cards, left dock, large titles.
   Design size 800x480, scaled to the screen by fit(). */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:#EEEEF3; --line:rgba(60,60,67,.12); --text:#0B0B0F; --muted:#6E6E76; --faint:#A6A6AB;
  --blue:#0A84FF; --blueSoft:#E3EEFF; --sun:#FFC83A; --night:#1F3B95; --red:#FF3B30; --online:#34C759;
  --success:#248A3D; --successSoft:#E3F6E8; --danger:#D70015; --dangerSoft:#FDECEA;
  --glass:rgba(255,255,255,.56); --glassHi:rgba(255,255,255,.82); --glassLine:rgba(255,255,255,.75);
  --shadow:0 10px 30px rgba(31,38,64,.10),0 1px 2px rgba(31,38,64,.06);
  --robot:radial-gradient(circle at 35% 30%,#B8E4FF 0%,#4A9BFF 52%,#2152E0 100%);
  --sunGrad:linear-gradient(180deg,#FFE27A 0%,#FFC21A 100%);
  --wall:radial-gradient(60% 70% at 8% 0%,#DCE9FF 0%,rgba(220,233,255,0) 70%),
         radial-gradient(55% 65% at 100% 10%,#F6E3FF 0%,rgba(246,227,255,0) 70%),
         radial-gradient(70% 70% at 70% 110%,#FFE6EC 0%,rgba(255,230,236,0) 70%),
         linear-gradient(180deg,#F5F7FC 0%,#EEF0F7 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
body{font-family:"SF Pro Display","Noto Sans Thai","Noto Sans Thai UI","Noto Sans","IBM Plex Sans Thai",system-ui,sans-serif,"Noto Color Emoji";color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:none}
input{font:inherit;user-select:text}
#stage{position:absolute;left:0;top:0;width:800px;height:480px;transform-origin:0 0;background:var(--wall);overflow:hidden}
.hidden{display:none!important}
.emoji{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glassLine);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)}
.press:active,.dk:active,.emo:active,.btn:active{transform:scale(.95)}

/* ---------- dock (left, vertical) ---------- */
#dock{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:64px;border-radius:32px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:5}
.dk{width:50px;height:50px;border-radius:25px;display:grid;place-items:center;color:#3A3A40;transition:background .2s,color .2s,transform .12s}
.dk.on{background:var(--text);color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.dk.talk{color:var(--blue)}
.dsep{width:28px;height:1px;background:var(--line);margin:2px 0}

/* ---------- header ---------- */
.page{position:absolute;left:92px;top:0;right:0;bottom:0;padding:16px 22px 14px 12px}
.head{display:flex;align-items:center;justify-content:space-between;height:58px}
.who{display:flex;align-items:center;gap:12px}
.ava{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#8EC5FF,#5A7BFF);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;box-shadow:0 4px 12px rgba(74,110,255,.28);border:2px solid #fff}
.hi{font-size:13.5px;color:var(--muted);font-weight:500;line-height:1.2}
.nm{font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.clk{text-align:right}
.clk b{display:block;font-size:40px;font-weight:600;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums}
.st{display:flex;gap:8px;justify-content:flex-end;align-items:center;font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
.st .dot{width:7px;height:7px;border-radius:50%;background:var(--online)}
.st .dot.off{background:var(--red)}
.bat{display:inline-flex;align-items:center;gap:4px}
.bat i{display:inline-block;width:22px;height:11px;border-radius:3px;border:1.5px solid currentColor;position:relative;padding:1px}
.bat i::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;border-radius:0 1px 1px 0;background:currentColor}
.bat i span{display:block;height:100%;border-radius:1.5px;background:currentColor}
.bat.low{color:var(--red)}

/* ---------- home carousel ---------- */
.carousel{position:relative;height:334px;margin-top:10px;overflow:hidden;border-radius:30px;touch-action:none;user-select:none;-webkit-user-select:none}
.track{display:flex;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.slide{flex:none;width:100%;height:100%;padding:0 2px}
.sl{height:100%;border-radius:30px;padding:24px 28px;position:relative;overflow:hidden}
.dots{display:flex;gap:7px;justify-content:center;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(60,60,67,.22);transition:width .3s,background .3s}
.dots i.on{width:22px;background:var(--text)}
.heyChip{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:9px 16px 9px 12px;border-radius:999px;font-size:14px;font-weight:600;color:#3A3A40;white-space:nowrap}
.heyChip .mdot{width:22px;height:22px;border-radius:50%;background:var(--robot);display:grid;place-items:center;color:#fff}
.heyChip.live .mdot{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.15);box-shadow:0 0 0 6px rgba(10,132,255,.12)}}

/* slide 1: talk + check-in */
.talkSl{display:flex;flex-direction:column;align-items:center;text-align:center}
.bigT{font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin-top:6px}
.subT{font-size:17px;color:var(--muted);margin-top:6px}
.subT b{color:var(--text);font-weight:600}
.emobar{display:flex;gap:6px;padding:8px 10px;border-radius:999px;margin-top:22px}
.emo{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:30px;transition:transform .15s,background .2s}
.emo.on{background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12);transform:scale(1.1)}
.emoNote{font-size:13px;color:var(--muted);margin-top:10px}

/* orb (Pebbi) */
.orb{border-radius:50%;background:var(--robot);box-shadow:0 12px 34px rgba(42,110,255,.35),inset 0 -6px 16px rgba(10,40,160,.25),inset 0 6px 14px rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;gap:16%;transition:transform .12s;flex:none}
.eye{width:12%;height:22%;border-radius:999px;background:#fff}
.eye.zz{height:7%;background:none;border:3px solid #fff;border-top:0;border-radius:0 0 999px 999px;width:16%}

/* slide 2: music */
.musSl{display:flex;align-items:center;gap:26px;padding:24px 30px 60px}
.art{width:210px;height:210px;border-radius:22px;object-fit:cover;flex:none;box-shadow:0 18px 40px rgba(0,0,0,.2)}
.genArt{display:flex;flex-direction:column;justify-content:space-between;padding:16px;color:#fff;overflow:hidden}
.genArt b{font-size:54px;font-weight:800;line-height:1;letter-spacing:-2px;opacity:.95}
.genArt span{font-size:13px;font-weight:600;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mLbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:.2px}
.mTitle{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.mArtist{font-size:17px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:6px;border-radius:3px;background:rgba(60,60,67,.14);margin:16px 0 6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--text);border-radius:3px;width:0}
.ptimes{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pctl{display:flex;align-items:center;gap:20px;margin-top:12px}
.pctl .side{width:50px;height:50px;border-radius:50%;display:grid;place-items:center}
.pctl .big{width:66px;height:66px;border-radius:50%;background:var(--text);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.22)}

/* slide 3: coming up */
.upSl{display:flex;flex-direction:column;justify-content:center;padding:24px 34px 70px}
.upCard{display:flex;align-items:center;gap:16px;border-radius:26px;padding:18px 20px;margin-top:12px;background:#fff;box-shadow:var(--shadow)}
.cap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:52px;padding:10px 0;border-radius:26px;background:var(--sunGrad);color:#5B4300;font-weight:800;font-size:12.5px;flex:none}
.cap.night{background:var(--night);color:#fff}
.cap.h{flex-direction:row;width:auto;padding:6px 12px;gap:6px}
.pillI{width:44px;height:44px;border-radius:50%;background:#5B9DF5;display:grid;place-items:center;color:#fff;flex:none}
.medN{font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.medS{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.late{color:var(--red);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:16px;padding:12px 20px;border-radius:999px;flex:none;transition:transform .12s}
.btn.pri{background:var(--text);color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 8px 18px rgba(10,132,255,.28)}
.btn.sec{background:rgba(120,120,128,.14);color:var(--text)}
.chip{font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;flex:none;background:rgba(120,120,128,.14);color:var(--muted)}
.chip.ok{background:var(--successSoft);color:var(--success)}
.chip.miss{background:var(--dangerSoft);color:var(--danger)}

/* ---------- medicine page ---------- */
.ttl{font-size:34px;font-weight:700;letter-spacing:-.8px;line-height:1.1}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;height:356px;margin-top:10px}
.colBox{min-width:0;border-radius:28px;padding:16px 14px 0;display:flex;flex-direction:column;min-height:0}
.colBox.dark{background:linear-gradient(180deg,rgba(40,44,58,.86),rgba(28,30,40,.92));color:#fff;border:1px solid rgba(255,255,255,.1)}
.colH{font-size:19px;font-weight:700;letter-spacing:-.3px;text-align:center;line-height:1.15;padding:0 6px 10px}
.scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:2px 2px 14px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.take{display:flex;align-items:center;gap:9px;background:#fff;border-radius:999px;padding:6px 14px 6px 8px;box-shadow:0 4px 14px rgba(0,0,0,.08);color:var(--text);text-align:left;width:100%}
.take .nx{font-size:9px;font-weight:700;line-height:1;width:20px;color:var(--text)}
.take .cap{width:34px;padding:6px 0;font-size:10px;border-radius:17px}
.take .pI{width:28px;height:28px;border-radius:50%;background:#5B9DF5;display:grid;place-items:center;color:#fff;flex:none}
.take .n{flex:1;min-width:0;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.take .n small{display:block;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.take .d{font-size:11.5px;font-weight:600;color:var(--muted);flex:none;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.take.done{opacity:.55}
.take.missed .n{color:var(--danger)}
.up{display:flex;align-items:center;gap:10px;border-radius:999px;padding:8px 8px 8px 10px;background:linear-gradient(180deg,#51A2F8 0%,#3E7FC4 100%);color:#fff;text-align:left;width:100%;box-shadow:0 6px 16px rgba(46,110,200,.25)}
.up .rI{width:26px;height:26px;border-radius:50%;background:#F06A6A;display:grid;place-items:center;flex:none}
.up .n{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .t{flex:none;font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;background:#FDE46A;color:#5B4300;display:flex;align-items:center;gap:4px}
.up .t.night{background:var(--night);color:#fff}
.up.dim{opacity:.55}
.emptyBox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--muted);font-size:14px;padding-bottom:20px}

/* ---------- medicine detail / dose alert ---------- */
.sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:18px;background:rgba(20,20,28,.32);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.medCard{width:300px;height:400px;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 30px 70px rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.2,.9,.3,1.2);background:#F1B53A}
@keyframes pop{from{transform:scale(.92) translateY(10px);opacity:.4}}
.medCard img{position:absolute;left:-30px;top:20px;width:360px;height:360px;object-fit:cover}
.medCard .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(241,181,58,.0) 45%,rgba(214,150,30,.85) 100%)}
.medCard .nx{position:absolute;left:22px;top:20px;color:#fff;font-size:34px;font-weight:800;line-height:.95;letter-spacing:-1px;text-shadow:0 2px 10px rgba(120,80,0,.25)}
.medCard .badge{position:absolute;right:18px;top:18px;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center}
.medCard .info{position:absolute;left:22px;right:22px;bottom:20px;color:#fff}
.medCard .info b{display:block;font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.15}
.medCard .info span{display:block;font-size:13px;opacity:.92;margin-top:3px}
.medCard .info .tm{position:absolute;right:0;bottom:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px}
.sideCol{display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:250px}
.sideCol .h{color:#fff;font-size:22px;font-weight:700;letter-spacing:-.4px;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.sideCol .s{color:rgba(255,255,255,.9);font-size:14px;line-height:1.5}
.xBtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.tray{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);color:var(--blue);font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px}

/* ---------- Pebbi listening / answering (Apple Intelligence style) ---------- */
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
#ai{position:absolute;inset:0;z-index:15;background:radial-gradient(80% 80% at 50% 45%,rgba(255,255,255,.82),rgba(240,242,250,.7));backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);animation:fade .25s}
.glow{position:absolute;inset:0;pointer-events:none;border-radius:0;padding:10px;
  background:conic-gradient(from var(--ang),#FF8A3D,#FF3CAC,#B44CFF,#4C7BFF,#2BD9E0,#6BFF9E,#FFD23D,#FF8A3D);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  filter:blur(10px);opacity:.95;animation:spinA 4s linear infinite}
.glow.sharp{filter:blur(2px);padding:4px;opacity:.9}
#ai.thinking .glow{animation-duration:1.6s}
#ai.speaking .glow{animation-duration:3s}
@keyframes spinA{to{--ang:360deg}}
.aiCenter{position:absolute;left:92px;right:0;top:40px;bottom:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.aiState{font-size:15px;font-weight:600;color:#5A5A62;letter-spacing:.2px}
.aiReply{max-width:560px;font-size:22px;font-weight:600;line-height:1.4;letter-spacing:-.2px;color:var(--text);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.subtitle{position:absolute;left:calc(92px + 40px);right:40px;bottom:30px;display:flex;justify-content:center}
.subtitle span{display:inline-block;max-width:100%;background:rgba(18,18,24,.82);color:#fff;padding:11px 20px;border-radius:22px;font-size:17px;line-height:1.45;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.subtitle .you{opacity:.6;font-weight:600;margin-right:6px}
.aiClose{position:absolute;right:18px;top:18px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.ring{position:relative;display:grid;place-items:center;width:190px;height:190px}
.ring::before,.ring::after{content:"";position:absolute;inset:22px;border-radius:50%;border:3px solid rgba(76,123,255,.3);opacity:0}
.ring.listening::before{animation:pulse 1.6s ease-out infinite}
.ring.listening::after{animation:pulse 1.6s ease-out .8s infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.3);opacity:0}}
.ring.thinking .orb{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.dots3{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.dots3 i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:d3 1s infinite}
.dots3 i:nth-child(2){animation-delay:.15s}.dots3 i:nth-child(3){animation-delay:.3s}
@keyframes d3{50%{opacity:.25}}
.crisis{position:absolute;left:calc(92px + 40px);right:40px;top:18px;background:#fff;border-radius:18px;padding:10px 14px;font-size:13px;color:var(--danger);box-shadow:var(--shadow)}
.crisis .nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.crisis .nums span{background:var(--dangerSoft);border-radius:999px;padding:4px 10px;font-weight:700;color:var(--text)}


/* ---------- type to talk (no microphone yet) ---------- */
.tchat{position:absolute;left:24px;right:84px;top:16px;bottom:292px;display:flex;flex-direction:column;gap:8px;overflow:hidden;justify-content:flex-end}
.bub{max-width:78%;padding:9px 14px;border-radius:20px;font-size:15.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bub.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bub.p{align-self:flex-start;background:#fff;box-shadow:var(--shadow);border-bottom-left-radius:6px}
.bub.hint{align-self:center;background:none;color:var(--muted);font-size:14px;text-align:center}
.tbar{position:absolute;left:20px;right:20px;bottom:244px;display:flex;gap:8px;align-items:center}
.tbox{flex:1;height:42px;border-radius:21px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;padding:0 16px;font-size:17px;overflow:hidden;white-space:nowrap}
.tbox .ph{color:var(--faint);font-size:15px}
.tbox .cur{display:inline-block;width:2px;height:22px;background:var(--blue);margin-left:1px;animation:blink 1s steps(1) infinite}
.tsend{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.tsend[disabled]{opacity:.4}
.chips2{position:absolute;left:20px;right:20px;bottom:262px;display:none}
.tkb{position:absolute;left:0;right:0;bottom:0;height:238px;background:rgba(209,212,219,.96);padding:6px 4px 8px;display:flex;flex-direction:column;gap:6px}
.tkb .kr{display:flex;gap:5px;justify-content:center}
.tkb .k{height:34px;flex:1;max-width:60px;background:#fff;border-radius:7px;font-size:19px;font-weight:500;box-shadow:0 1px 0 rgba(0,0,0,.25);display:grid;place-items:center}
.tkb .k:active{background:#BFC3CC}
.tkb .k.f{background:#AEB3BE;font-size:14px;max-width:none;flex:1.4}
.tkb .k.f.on{background:#fff}
.tkb .k.sp{flex:5;max-width:none;font-size:14px}
.tkb .k.go{background:var(--blue);color:#fff;font-size:15px;max-width:none;flex:1.8}
.qchips{display:flex;gap:6px;overflow:hidden;flex:none;height:30px;padding:0 4px}
.qchips button{flex:none;background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;box-shadow:0 1px 0 rgba(0,0,0,.15)}
/* ---------- music page ---------- */
.player{display:flex;align-items:center;gap:30px;height:360px;padding:0 16px}
.player .art{width:260px;height:260px;border-radius:26px}
.vol{display:flex;align-items:center;gap:10px;margin-top:16px;max-width:400px}
.vol .vb{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center}
.vol .vm.on{color:var(--red)}
.vbar{flex:1;height:10px;border-radius:999px;background:rgba(60,60,67,.16);position:relative;padding:14px 0;background-clip:content-box;box-sizing:content-box}
.vbar i{position:absolute;left:0;top:14px;height:10px;border-radius:999px;background:var(--text);width:0}
.vbar.muted i{background:#B9B9BF}
.vtxt{width:44px;flex:none;text-align:right;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.step{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.step i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--text);color:#fff;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center}

.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(60,60,67,.15);border-top-color:var(--text);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- settings sheet ---------- */
.setSheet{width:460px;border-radius:30px;padding:20px 22px;background:rgba(248,248,252,.96);box-shadow:0 30px 70px rgba(0,0,0,.3);animation:pop .25s}
.setSheet .row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:16px}
.setSheet .row:last-child{border-bottom:0}
.setSheet .row .sk{flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setSheet .row .sv{flex:none;max-width:45%;color:var(--muted);font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.setSheet .row .ico{flex:none}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}

/* ---------- LED face sheet ---------- */
.ledSheet{width:620px}
.ledGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.ledGrid button{height:46px;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:15px;font-weight:600;color:var(--text)}
.ledGrid button.on{background:var(--text);color:#fff}
.ledHead{font-size:13px;font-weight:700;color:var(--muted);margin-top:12px}
.ledBar{display:flex;gap:8px;margin-top:12px}
.ledBar button{flex:1;height:46px;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:15px;font-weight:700}
.ledBar button.on{background:var(--blue);color:#fff}

/* ---------- toast / sleep ---------- */
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(18,18,24,.88);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:fade .2s;z-index:30}
.sleep{position:absolute;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:40px;padding:0 56px 0 48px;animation:fade .6s;z-index:25}
/* StandBy clock: each digit slides up when it changes */
.sleep .clk{display:flex;align-items:center;font-family:"Noto Sans",system-ui,sans-serif;font-weight:800;font-size:180px;line-height:1;letter-spacing:-4px;color:#fff;font-variant-numeric:tabular-nums}
.sleep .dg{position:relative;display:inline-block;width:.58em;height:1.02em;overflow:hidden;text-align:center}
.sleep .dg span{position:absolute;left:0;right:0;top:0}
.sleep .dg span.in{animation:dgIn .7s cubic-bezier(.2,.8,.2,1) both}
.sleep .dg span.out{animation:dgOut .7s cubic-bezier(.2,.8,.2,1) both}
.sleep .colon{display:inline-block;width:.26em;text-align:center;transform:translateY(-.06em);animation:colonBlink 2s ease-in-out infinite}
@keyframes dgIn{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes dgOut{from{transform:none;opacity:1}to{transform:translateY(-100%);opacity:0}}
@keyframes colonBlink{0%,100%{opacity:1}50%{opacity:.35}}
.sleep .side{align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;padding:96px 0 104px;min-width:230px}
.sleep .d{font-size:32px;font-weight:600;color:#fff;line-height:1.2}
.sleep .d b{color:#8E8E93;font-weight:600;margin-right:8px}
.sleep .nx{display:flex;flex-direction:column;gap:6px}
.sleep .nx .h{display:flex;align-items:center;gap:8px;color:#8E8E93;font-size:20px;font-weight:600}
.sleep .nx .t{font-size:38px;font-weight:700;color:#fff;line-height:1.1}
.sleep .nx .n{font-size:22px;color:#D1D1D6;font-weight:500;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sleep .nx .none{font-size:22px;color:#D1D1D6}
.sleep .np{font-size:15px;color:#8E8E93;margin-top:14px;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- motion (soft, springy, iOS-like) ---------- */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,.8,.2,1)}
.press,.dk,.emo,.btn,.take,.up,.qchips button,.tsend,.aiClose{transition:transform .38s var(--spring),background .2s,color .2s,box-shadow .2s}
.press:active,.dk:active,.emo:active,.btn:active,.take:active,.up:active,.qchips button:active,.tsend:active{transform:scale(.93);transition-duration:.08s}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popOut{to{opacity:0;transform:scale(.94) translateY(8px)}}
@keyframes springIn{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes emoPop{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(-8deg)}65%{transform:scale(.95) rotate(4deg)}100%{transform:scale(1.1)}}
@keyframes bubIn{from{opacity:0;transform:translateY(14px) scale(.9)}}
@keyframes subIn{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}
@keyframes artPlay{from{transform:scale(.86)}to{transform:scale(1)}}
@keyframes artPause{from{transform:scale(1)}to{transform:scale(.86)}}
@keyframes keyPop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-100%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-115%) scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,24px) scale(.9)}}
@keyframes eyeBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes floaty{50%{transform:translateY(-6px)}}
/* page switch: children rise one after another */
.page.enter>*{animation:rise .55s var(--ease) both}
.page.enter>*:nth-child(2){animation-delay:.06s}.page.enter>*:nth-child(3){animation-delay:.12s}
.page.enter>*:nth-child(4){animation-delay:.18s}.page.enter>*:nth-child(5){animation-delay:.24s}
.page.enter .take,.page.enter .up{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + .12s)}
/* dock: one highlight pill that slides between tabs */
#dock .dk{position:relative;z-index:1}
#dock .dk.on{background:transparent;box-shadow:none}
#dockPill{position:absolute;left:7px;top:0;width:50px;height:50px;border-radius:25px;background:var(--text);box-shadow:0 6px 14px rgba(0,0,0,.18);
  transition:transform .5s var(--spring),opacity .2s;z-index:0;pointer-events:none;opacity:0}
/* closing sheets / overlays */
#sheet.closing .sheet{animation:fadeOut .22s forwards}
.toast.closing{animation:fadeOut .2s forwards}
#sheet.closing .medCard,#sheet.closing .setSheet{animation:popOut .22s forwards}

#ai.opening #ring{animation:springIn .7s var(--spring) both}
#ai.opening .aiState{animation:rise .5s var(--ease) .15s both}
.subtitle.nw span{display:inline-block;animation:subIn .45s var(--ease) both}
.bub.nw{animation:bubIn .4s var(--spring) both;transform-origin:bottom right}
.bub.p.nw{transform-origin:bottom left}
.emo.pop{animation:emoPop .6s var(--spring) both}
.art.play{animation:artPlay .6s var(--spring) both}
.art.paused{transform:scale(.86)}.art.paused.chg{animation:artPause .5s var(--ease) both}
.orb .eye:not(.zz){animation:eyeBlink 4.6s infinite;transform-origin:center}
.toast{animation:toastIn .45s var(--spring)}
#keyPop{position:absolute;z-index:40;pointer-events:none;min-width:46px;height:52px;padding:0 10px;border-radius:10px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25);
  display:grid;place-items:center;font-size:28px;font-weight:500;animation:keyPop .32s ease-out forwards}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

function fresh(key, val, ms = 600) {
  const f = freshSeen[key];

function onWifiTap(a, t) {
  if (a === 'wclose') { closeWifi(); return true; }

  if (a === 'wback') { W.sel = null; W.pw = ''; send({a:'wifiClear'}); render(); return true; }
  if (a === 'wsel') {
    if (t.dataset.act === '1') return true;  // already on it
    if (t.dataset.ent === '1') { W.note = `“${t.dataset.ssid}” ต้องใช้ชื่อผู้ใช้ + รหัสผ่าน ตั้งค่าบนหน้าจอนี้ยังไม่ได้ ใช้ Wi-Fi อื่นหรือฮอตสปอตมือถือแทน`; render(); return true; }
    W.note = '';
    W.sel = t.dataset.ssid; W.secure = t.dataset.sec === '1'; W.pw = ''; W.show = false; W.shift = false; W.sym = false;
    send({a:'wifiClear'});
    if (!W.secure || t.dataset.known === '1') { send({a:'wifiConnect', ssid:W.sel, pw:''}); }  // open / saved: no password
    render(); return true;
  }
  if (a === 'wshow') { W.show = !W.show; render(); return true; }
  if (a === 'k') { if (W.pw.length < 63) W.pw += t.dataset.k; if (W.shift) W.shift = false; send({a:'wifiClear'}); render(); return true; }

  if (a === 'ksym') { W.sym = !W.sym; W.shift = false; render(); return true; }
  if (a === 'wgo') { wifiConnect(); return true; }
  return false;
}

function readyDots(n, r, size, phase, cls) {
  let h = '';
  for (let k = 0; k < n; k++) {
    const a = (k / n) * Math.PI * 2 + phase;
    const x = Math.cos(a) * r - size / 2, y = Math.sin(a) * r - size / 2;
    h += `<i style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${size}px;height:${size}px;animation-delay:${(-k * 1.6 / n).toFixed(2)}s"></i>`;
  }
  return `<div class="dots ${cls}">${h}</div>`;
}

    send({a:'volume', do:'set', value:v});
  }
  else if (a === 'med') { sheet = {kind:'med', id:t.dataset.id}; render(); }
  else if (a === 'settings') { sheet = {kind:'settings'}; render(); }
  else if (a === 'ledOpen') { sheet = {kind:'led'}; render(); }
  else if (a === 'ledPlay') send({a:'led', do:'play', name:t.dataset.n});
  else if (a === 'ledAuto') send({a:'led', do:'auto'});
  else if (a === 'ledOff') send({a:'led', do:'off'});
  else if (a === 'ledBr') send({a:'led', do:'bright', value:Math.max(0, Math.min(100, ((S.led && S.led.bright) || 50) + Number(t.dataset.v)))});
  else if (a === 'close') { if (t.classList.contains('sheet') && e.target !== t) return; sheet = null; render(); }

// swipe between home slides: the cards follow the finger, then snap to the next / previous one.
// (touch-action:none on .carousel stops Chromium from treating the drag as a page scroll and
//  cancelling it with pointercancel, which is why swiping did nothing before)
let drag = null, swallowClick = false;
function slideX(extraPx = 0) { return `translateX(calc(-${slide * 100}% + ${extraPx}px))`; }
document.addEventListener('pointerdown', (e) => {
  if (view !== 'home' || !e.target.closest('.carousel')) return;
  const tr = $('track'); if (!tr) return;
  drag = {x: e.clientX, y: e.clientY, dx: 0, id: e.pointerId, moved: false};
  tr.style.transition = 'none';
});

  if (!drag || e.pointerId !== drag.id) return;
  drag.dx = e.clientX - drag.x;
  if (Math.abs(drag.dx) > 8) drag.moved = true;
  const n = slides().length;
  let dx = drag.dx;
  if ((slide === 0 && dx > 0) || (slide === n - 1 && dx < 0)) dx *= 0.35;   // rubber-band at the ends
  const tr = $('track'); if (tr) tr.style.transform = slideX(dx);
});
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag; drag = null;
  const tr = $('track'); if (tr) tr.style.transition = '';
  const n = slides().length;
  const w = ($('track') && $('track').parentElement.offsetWidth) || 600;
  const from = slide;
  if (Math.abs(d.dx) > Math.min(60, w * 0.12)) {
    slide = Math.max(0, Math.min(n - 1, slide + (d.dx < 0 ? 1 : -1)));
    slideAt = Date.now(); holdUntil = Date.now() + 15000;
  }
  if (d.moved) { swallowClick = true; setTimeout(() => { swallowClick = false; }, 350); }
  // glide on from where the finger let go (the track may be rebuilt by render)
  lastX = `translateX(calc(-${from * 100}% + ${d.dx}px))`;

// a swipe that starts on a button (emoji, play…) must not also press it

function musicHTML() {
  const m = S.music;
  const head = header('เพลง');
  if (!m) return head + `<div class="player"><div class="emptyBox">ยังไม่ได้ติดตั้งระบบเพลงบนหุ่น</div></div>`;
  if (m.kind === 'bluetooth' && m.error) return head + `<div class="player">${artHTML(null, 240)}<div><div class="mTitle">ใช้ Bluetooth ไม่ได้</div><div class="mArtist">${esc(m.error)}</div></div></div>`;
  if (m.kind === 'bluetooth' && !m.device) {
    const pairing = m.pairLeft > 0 ? `<div class="btWait"><div class="spin" style="width:20px;height:20px;border-top-color:var(--blue)"></div>พร้อมให้จับคู่ · เหลือ ${mmss(m.pairLeft)}</div>`
      : `<div style="margin-top:16px"><button class="btn blue" data-a="btPair">${ic('bt', 18)}จับคู่มือถือ</button></div>`;
    const again = m.paired && m.paired.length ? `<div class="sub" style="margin-top:12px">มือถือที่เคยจับคู่ (${esc(m.paired.join(', '))}) แค่เปิด Bluetooth แล้วแตะ <b>${esc(m.name)}</b></div>` : '';
    return head + `<div class="player"><div class="art genArt" style="width:240px;height:240px;background:linear-gradient(140deg,#5AA7FF,#2152E0);align-items:center;justify-content:center">${ic('bt', 90, 1.6)}</div><div>
      <div class="mTitle">ใช้หุ่นเป็นลำโพง</div><div class="mArtist">เปิดเพลงจากมือถือ เสียงออกที่ Pebble</div>
      <div class="steps"><div class="step"><i>1</i><div>แตะ <b>จับคู่มือถือ</b></div></div>
        <div class="step"><i>2</i><div>มือถือ: ตั้งค่า → Bluetooth → แตะ <b>${esc(m.name)}</b></div></div>
        <div class="step"><i>3</i><div>เปิดเพลงจากแอปไหนก็ได้</div></div></div>${pairing}${again}</div></div>`;
  }
  if (!musicOn()) return head + `<div class="player">${artHTML(null, 240)}<div>
      <div class="mLbl">${m.device ? `เชื่อมต่อกับ ${esc(m.device)}` : esc(m.name || '')}</div>
      <div class="mTitle">เปิดเพลงบนมือถือได้เลย</div><div class="mArtist">เสียงจะออกที่หุ่น</div>${volHTML()}
      ${m.kind === 'bluetooth' ? `<div style="margin-top:14px"><button class="btn sec" data-a="btDisconnect">ตัดการเชื่อมต่อ</button></div>` : ''}</div></div>`;
  return head + `<div class="player">${artHTML(m, 260)}<div style="min-width:0;flex:1">
      <div class="mLbl">${m.device ? `เล่นจาก ${esc(m.device)}` : `กำลังเล่นบน ${esc(m.name || 'Pebble')}`}</div>
      <div class="mTitle">${esc(m.title)}</div>
      <div class="mArtist">${esc(m.artist || '')}${m.album ? ` · ${esc(m.album)}` : ''}</div>
      ${m.length ? `<div class="pbar"><i class="pfill"></i></div><div class="ptimes"><span class="ppos"></span><span>${mmss(m.length)}</span></div>` : ''}
      ${ctlHTML(m)}${volHTML()}</div></div>`;
}

// ---------------------------------------------------------------- Pebbi (wake word / talk)
const STATE_TEXT = {listening:'กำลังฟัง', thinking:'กำลังคิด', speaking:'Pebbi', waiting:'พร้อมฟัง'};
function aiHTML() {
  const t = S.talk;
  const st = t.state;
  const msgs = t.messages || [];
  const lastUser = [...msgs].reverse().find((m) => m.role === 'user');
  const lastPebbi = [...msgs].reverse().find((m) => m.role === 'pebbi');
  let sub = '';
  if (st === 'listening') sub = 'พูดได้เลย Pebbi ฟังอยู่';
  else if (st === 'thinking') sub = lastUser ? `<span class="you">คุณ</span>${esc(lastUser.text)}` : '';
  else if (st === 'speaking') sub = esc(t.caption || (lastPebbi && lastPebbi.text) || '');
  else sub = t.typed ? 'หุ่นนี้ยังไม่มีไมโครโฟน' : 'Pebbi พร้อมฟัง';
  const crisis = t.crisis ? `<div class="crisis"><b>เราเป็นห่วงนะ ถ้ารู้สึกไม่ปลอดภัย โทรหาคนเหล่านี้ได้เลย</b>
    <div class="nums">${t.crisis.map((x) => `<span>${esc(x.label)} ${esc(x.phone)}</span>`).join('')}</div></div>` : '';
  return `${crisis}<div class="aiCenter"><div class="ring ${st}" id="ring">${orb(128, false)}</div>
      <div class="aiState">${STATE_TEXT[st] || ''}${st === 'thinking' || st === 'listening' ? '<span class="dots3"><i></i><i></i><i></i></span>' : ''}</div></div>
    ${sub ? `<div class="subtitle ${fresh('sub', st + sub) ? 'nw' : ''}"><span>${sub}</span></div>` : ''}
    <button class="aiClose glass press" data-a="stop" aria-label="จบการคุย">${ic('x', 22, 2.4)}</button>`;
}


// ---------------------------------------------------------------- type to talk (until a microphone is plugged in)
const T = {text:'', lang:'th', shift:false};
const TKB = {
  th:['ๅ/-ภถุึคตจขช', 'ๆไำพะัีรนยบล', 'ฟหกดเ้่าสวง', 'ผปแอิืทมใฝ'],
  thS:['+๑๒๓๔ู฿๕๖๗๘๙', '๐"ฎฑธํ๊ณฯญฐ,', 'ฤฆฏโฌ็๋ษศซ.', '()ฉฮฺ์?ฒฬฦ'],
  en:['1234567890', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm'],
  enS:['!@#$%^&*()', 'QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'],
};
const QUICK = ['วันนี้เหนื่อยมาก', 'อยากระบายหน่อย', 'นอนไม่ค่อยหลับ', 'วันนี้รู้สึกดีขึ้นนะ', 'ขอบคุณนะ'];
function typeHTML() {
  const t = S.talk;
  const msgs = (t.messages || []).slice(-6);
  const all = t.messages || [];
  const nw = fresh('bub', all.length);
  const bubbles = msgs.length ? msgs.map((m, i) => `<div class="bub ${m.role === 'user' ? 'u' : 'p'} ${nw && i === msgs.length - 1 ? 'nw' : ''}">${esc(m.text)}</div>`).join('')
    : `<div class="bub hint">ยังไม่ได้เสียบไมโครโฟน พิมพ์คุยกับ Pebbi ได้เลยนะ<br>เล่าอะไรก็ได้ Pebbi ฟังอยู่</div>`;
  const thinking = t.state === 'thinking' || (msgs.length && msgs[msgs.length - 1].role === 'user')
    ? `<div class="bub p ${fresh('think', all.length) ? 'nw' : ''}">กำลังพิมพ์<span class="dots3"><i></i><i></i><i></i></span></div>` : '';
  const rows = TKB[T.lang + (T.shift ? 'S' : '')];
  const key = (c) => `<button class="k" data-a="tk" data-k="${esc(c)}">${esc(c)}</button>`;
  const box = T.text ? esc(T.text) : '<span class="ph">พิมพ์ข้อความ…</span>';
  return `<div class="tchat">${bubbles}${thinking}</div>
    <div class="tbar"><div class="tbox">${box}<span class="cur"></span></div>
      <button class="tsend" data-a="tsend" ${T.text.trim() ? '' : 'disabled'} aria-label="ส่ง">${ic('check', 20, 2.6)}</button></div>
    <div class="tkb">
      <div class="qchips">${QUICK.map((q) => `<button data-a="tq" data-k="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <div class="kr">${[...rows[0]].map(key).join('')}</div>
      <div class="kr">${[...rows[1]].map(key).join('')}</div>
      <div class="kr">${[...rows[2]].map(key).join('')}</div>
      <div class="kr"><button class="k f ${T.shift ? 'on' : ''}" data-a="tshift">${ic('shift', 18)}</button>${[...rows[3]].map(key).join('')}<button class="k f" data-a="tdel">${ic('bksp', 20)}</button></div>
      <div class="kr"><button class="k f" data-a="tlang">${T.lang === 'th' ? 'ABC' : 'ไทย'}</button><button class="k sp" data-a="tk" data-k=" ">เว้นวรรค</button><button class="k go" data-a="tsend">ส่ง</button></div>
    </div>
    <button class="aiClose glass press" style="top:12px" data-a="stop" aria-label="จบการคุย">${ic('x', 22, 2.4)}</button>`;
}
function onTypeTap(a, t) {
  if (a === 'tk' || a === 'tdel' || a === 'tq') keyPreview(t, a === 'tk' ? t.dataset.k : '');
  if (a === 'tk') { if (T.text.length < 500) T.text += t.dataset.k; if (T.shift) T.shift = false; render(); return true; }
  if (a === 'tq') { T.text = t.dataset.k; render(); return true; }
  if (a === 'tdel') { T.text = [...T.text].slice(0, -1).join(''); render(); return true; }
  if (a === 'tshift') { T.shift = !T.shift; render(); return true; }
  if (a === 'tlang') { T.lang = T.lang === 'th' ? 'en' : 'th'; T.shift = false; render(); return true; }
  if (a === 'tsend') { const v = T.text.trim(); if (v) { send({a:'send', text:v}); T.text = ''; render(); } return true; }
  return false;
}

// ---------------------------------------------------------------- render
function render() {
  if (!S) return;
  const ready = S.mode === 'ready';
  if (ready) setupStep = 'welcome';
  $('gate').classList.toggle('hidden', ready);
  $('app').classList.toggle('hidden', !ready);
  if (!ready) set($('gate'), gateHTML());

  if (ready) {
    for (const v of ['home', 'meds', 'music']) $(v).classList.toggle('hidden', v !== view);
    const switched = view !== lastView; lastView = view;
    document.querySelectorAll('#dock [data-go]').forEach((b) => b.classList.toggle('on', b.dataset.go === view));
    const icons = {home:'home', meds:'pill', music:'music'};
    document.querySelectorAll('#dock [data-go]').forEach((b) => set(b, ic(icons[b.dataset.go], 24)));
    set(document.querySelector('#dock [data-a="talk"]'), ic('spark', 24));
    set(document.querySelector('#dock [data-a="settings"]'), ic('gear', 22, 1.8));
    moveDockPill();
    if (view === 'home' && !drag) {
      const n = slides().length;
      if (Date.now() > holdUntil && Date.now() - slideAt > 7000 && !sheet) { slide = (slide + 1) % n; slideAt = Date.now(); }
      set($('home'), homeHTML());
      const tr = $('track');
      if (tr) {
        const x = `translateX(-${Math.min(slide, n - 1) * 100}%)`;
        // the track is rebuilt when the slide changes: start it where the old one was, then glide
        if (tr !== lastTrack && lastX && lastX !== x) { tr.style.transition = 'none'; tr.style.transform = lastX; void tr.offsetWidth; tr.style.transition = ''; }
        tr.style.transform = x; lastTrack = tr; lastX = x;
      }
    }
    if (view === 'meds') set($('meds'), medsHTML());
    if (view === 'music') set($('music'), musicHTML());
    if (switched) enter($(view));
    const m = S.music;
    if (m && m.length) {
      document.querySelectorAll('.pfill').forEach((el) => { el.style.width = Math.min(100, (m.position / m.length) * 100) + '%'; });
      document.querySelectorAll('.ppos').forEach((el) => { el.textContent = mmss(m.position); });
    }
  }

  // Pebbi talking: full screen with the Apple-Intelligence-style glow
  const talking = ready && S.talk.active;
  if (talking && !aiShown) aiOpenAt = Date.now();
  aiShown = talking;
  if (talking) {
    clearTimeout($('ai')._ct);
    $('ai').className = S.talk.state + (S.talk.typed ? ' typed' : '') + (Date.now() - aiOpenAt < 750 ? ' opening' : '');
    set($('aiBody'), S.talk.typed ? typeHTML() : aiHTML());
    const k = 1 + Math.min(S.level, 1) * 0.16;
    const o = document.querySelector('#ring .orb'); if (o) o.style.transform = `scale(${k})`;
  } else closeLater($('ai'), 280);

  // sheets: medicine pop-up (time to take) > medicine detail > settings
  let sh = '';
  if (ready && S.pending && !talking) sh = alertHTML();
  else if (ready && sheet && sheet.kind === 'med') sh = medSheetHTML();
  else if (ready && sheet && sheet.kind === 'settings') sh = settingsHTML();
  else if (ready && sheet && sheet.kind === 'led') sh = ledHTML();
  const shEl = $('sheet');
  if (sh) { clearTimeout(shEl._ct); shEl.classList.remove('hidden', 'closing'); set(shEl, sh); }
  else closeLater(shEl, 220, () => set(shEl, ''));

  // StandBy clock when nobody is around
  const sleep = ready && S.sleep && S.idleSeconds > 60 && Date.now() > awakeUntil && !S.pending && !talking;
  $('sleep').classList.toggle('hidden', !sleep);
  if (sleep) paintStandby();

  paintVolume();

  $('wifi').classList.toggle('hidden', !W.open);
  if (W.open) {
    const r = (S.wifiSetup || {}).result;
    if (!(r && r.ok)) W.doneAt = 0;
    set($('wifi'), wifiHTML());
  }
  if (S.toast) { clearTimeout($('toast')._ct); $('toast').classList.remove('hidden', 'closing'); set($('toast'), esc(S.toast)); }
  else closeLater($('toast'), 200);
}
// StandBy: big clock (digits slide up as they change) + date + the next medicine
function paintStandby() {
  const el = $('sleep');
  if (!el.querySelector('.clk')) {
    el._h = null;
    el.innerHTML = `<div class="clk"><span class="dg"></span><span class="dg"></span><span class="colon">:</span><span class="dg"></span><span class="dg"></span></div><div class="side"></div>`;
  }
  const chars = (S.clock || '--:--').replace(':', '').padStart(4, ' ').split('');
  el.querySelectorAll('.dg').forEach((dg, i) => {
    const c = chars[i];
    if (dg.dataset.v === c) return;
    const first = dg.dataset.v === undefined;
    dg.dataset.v = c;
    dg.querySelectorAll('span.out').forEach((o) => o.remove());
    const old = dg.querySelector('span');
    if (old) { old.className = 'out'; setTimeout(() => old.remove(), 750); }
    const n = document.createElement('span');
    n.textContent = c;
    if (!first) n.className = 'in';
    dg.appendChild(n);
  });
  const d = (S.doses || []).filter((x) => x.status === 'pending');
  const next = d.find((x) => x.due) || d[0];
  const [day, ...rest] = String(S.date || '').split(' ');
  const np = musicOn() && S.music.status === 'Playing' ? `<div class="np">♪ ${esc(S.music.title)} · ${esc(S.music.artist || '')}</div>` : '';
  set(el.querySelector('.side'), `<div class="d"><b>${esc(day)}</b>${esc(rest.join(' '))}</div>
    <div class="nx">${next
      ? `<div class="h">${ic('pill', 20, 2.2)}ยามื้อถัดไป</div><div class="t">${esc(next.time)}</div><div class="n">${esc(next.name)}${next.dosage ? ` · ${esc(next.dosage)}` : ''}</div>`
      : `<div class="h">${ic('pill', 20, 2.2)}ยามื้อถัดไป</div><div class="none">วันนี้ไม่มียาที่ต้องกินแล้ว</div>`}${np}</div>`);
}

setInterval(() => { if (S && view === 'home') render(); }, 1000);  // slide timer
</script>
