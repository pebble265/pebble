services:
  db:
    image: postgres:16
    container_name: pebble-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pebble
      POSTGRES_USER: pebble_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/pebble_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  pgdata:
